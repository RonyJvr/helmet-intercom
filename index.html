<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earpiece</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4.5a3 3 0 0 1 3 3v2a2 2 0 0 1-2 2H5.5A7.5 7.5 0 0 0 13 19v-1.5a2 2 0 0 1 2-2h2a3 3 0 0 1 3 3v1a2 2 0 0 1-2 2C10.82 21.5 2.5 13.18 2.5 3.99a2 2 0 0 1 2-2h1.5Z"/>
          </svg>
        </div>
        <div>
          <h1>Earpiece</h1>
          <span>Live room audio</span>
        </div>
      </div>

      <button id="roomButton" class="room-button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Zm3 1.5v6h10V9H7Zm2 1.5h6v3H9v-3Z"/>
        </svg>
        <span id="roomLabel">Room</span>
      </button>
    </header>

    <section class="status-card">
      <div class="status-left">
        <span id="statusDot" class="status-dot"></span>
        <div>
          <strong id="connectionStatus">Connecting...</strong>
          <span id="roomStatus">Joining room</span>
        </div>
      </div>

      <div class="people">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2 20a7 7 0 0 1 14 0v1H2v-1Zm14 1v-1a6.9 6.9 0 0 0-1.2-3.9A6 6 0 0 1 21 21h-5Z"/>
        </svg>
        <span id="peopleCount">1</span>
      </div>
    </section>

    <section class="main-card">
      <div class="earpiece-visual">
        <div class="earpiece-ring">
          <div class="earpiece-core">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4.5a3 3 0 0 1 3 3v2a2 2 0 0 1-2 2H5.5A7.5 7.5 0 0 0 13 19v-1.5a2 2 0 0 1 2-2h2a3 3 0 0 1 3 3v1a2 2 0 0 1-2 2C10.82 21.5 2.5 13.18 2.5 3.99a2 2 0 0 1 2-2h1.5Z"/>
            </svg>
          </div>
        </div>
      </div>

      <h2>Room Audio</h2>
      <p class="description">Hear everyone in the room through your phone.</p>

      <div class="controls">
        <div class="control">
          <div class="control-heading">
            <span>Amplification</span>
            <strong id="amplificationValue">1.0×</strong>
          </div>
          <input id="amplificationSlider" type="range" min="1" max="8" step="0.1" value="1">
        </div>

        <div class="control">
          <div class="control-heading">
            <span>Volume</span>
            <strong id="volumeValue">70%</strong>
          </div>
          <input id="volumeSlider" type="range" min="0" max="100" step="1" value="70">
        </div>
      </div>

      <button id="muteButton" class="mute-button">
        <span class="mute-icon">
          <svg id="micIcon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="3" width="8" height="12" rx="4"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/>
          </svg>
        </span>
        <span id="muteText">Mute Microphone</span>
      </button>
    </section>

    <section class="room-info">
      <div>
        <span>ROOM CODE</span>
        <strong id="roomCodeDisplay">------</strong>
      </div>
      <button id="copyRoomButton">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="8" width="11" height="11" rx="2"/>
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
        </svg>
        Copy
      </button>
    </section>
  </main>

  <div id="roomModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeRoomModal" class="close-button">×</button>
      <h2>Room</h2>
      <p>Enter a room code to join.</p>

      <input id="roomInput" type="text" maxlength="12" autocomplete="off">

      <button id="joinRoomButton" class="primary-button">Join Room</button>
      <button id="newRoomButton" class="secondary-button">Generate New Room</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
